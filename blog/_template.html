<!DOCTYPE html>
<html lang="en">
<head>
<script>
(() => {
  try {
    const t = localStorage.getItem("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POST TITLE — Charles Talbot</title>
<meta name="description" content="ONE-LINE SUMMARY, used for the index excerpt and social previews.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body>

<div class="wrap">

  <header class="subhead">
    <a class="back-link" href="./">← Blog</a>
    <h1>POST TITLE</h1>
    <p class="bio"><span class="blog-date">MONTH DAY, YEAR</span></p>
    <div class="theme-toggle" role="group" aria-label="Theme">
      <button type="button" data-theme-choice="light">Light</button>
      <button type="button" data-theme-choice="dark">Dark</button>
      <button type="button" data-theme-choice="system">System</button>
    </div>
  </header>

  <section class="post-body reveal">
    <p>First paragraph.</p>
    <p>Second paragraph.</p>
  </section>

</div>

<script src="../app.js"></script>
</body>
</html>
