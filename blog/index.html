<!DOCTYPE html>
<html lang="en">
<head>
<script>
(() => {
  try {
    const t = localStorage.getItem("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog — Charles Talbot</title>
<meta name="description" content="Notes on what Charles Talbot is building — software, pixel art, and clay.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body>

<div class="wrap">

  <header class="subhead">
    <a class="back-link" href="../">← Charles Talbot</a>
    <h1>Blog</h1>
    <p class="bio">Short notes on whatever's on the bench right now — code, pixel art, or clay.</p>
    <div class="theme-toggle" role="group" aria-label="Theme">
      <button type="button" data-theme-choice="light">Light</button>
      <button type="button" data-theme-choice="dark">Dark</button>
      <button type="button" data-theme-choice="system">System</button>
    </div>
  </header>

  <section class="reveal">
    <!--
      Newest post first. Each entry:
      <a class="blog-row" href="POST-FILE.html">
        <span class="blog-date">MONTH YEAR</span>
        <h3>POST TITLE</h3>
        <p>One-line excerpt.</p>
      </a>
      Copy _template.html to start a new post.
    -->
    <div class="blog-list"></div>
    <p class="projects-empty">Nothing published yet — first post coming soon.</p>
  </section>

</div>

<script src="../app.js"></script>
</body>
</html>
